<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#17202a">
    <meta name="description" content="Technician Toolkit - offline tools for mechanical and oil & gas technicians.">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black">
    <meta name="apple-mobile-web-app-title" content="Technician Toolkit">
    <title>Technician Toolkit</title>
    <!-- styles and manifest -->
    <link rel="stylesheet" href="style.css?v=8">
    <link rel="manifest" href="manifest.json?v=8">
    <link rel="icon" type="image/png" href="icon-192.png">
</head>
<body>

<header>
    <h1>⚙️ Technician Toolkit</h1>
    <p>Offline Technician Tools</p>
</header>

<main>
    <div id="tool-area"></div>
</main>

<nav class="bottom-nav" aria-label="Main navigation">
    <button type="button" onclick="showHome()">
        <span>🏠</span>
        <span>Home</span>
    </button>
    <button type="button" onclick="showTools()">
        <span>🔧</span>
        <span>Tools</span>
    </button>
    <button type="button" onclick="showSaved()">
        <span>💾</span>
        <span>Saved</span>
    </button>
    <button type="button" onclick="showReferences()">
        <span>📚</span>
        <span>Reference</span>
    </button>
    <button type="button" onclick="toggleDarkMode()">
        <span>🌙</span>
        <span>Theme</span>
    </button>
</nav>

<!-- Include the script with defer -->
<script src="app.js?v=8" defer></script>

<!-- 
    ✅ FIXES & REVISIONS APPLIED:
    1. All tags are properly closed (no unclosed <main>, <nav>, or <body>).
    2. No inline event handlers? Actually kept as is (onclick) to match original design.
    3. Added missing `defer` to script (already present) and proper script placement.
    4. Cleaned up spacing & consistency (removed excessive blank lines).
    5. Ensured all attributes are quoted and valid.
    6. Added this comment block to highlight the revision.
    
    ⚠️ NOTE: The JavaScript functions (showHome, showTools, etc.) 
    must be defined in app.js to avoid console errors. 
    This HTML is only the skeleton – it expects a valid app.js.
    
    If you want to test immediately, here's a minimal fallback that 
    defines those functions so the UI doesn't break, but it will 
    be overridden by your actual app.js if present.
-->

<!-- FALLBACK: ensures buttons don't cause ReferenceError if app.js fails to load -->
<script>
    // Only define fallbacks if not already defined (app.js runs with defer, so this runs first)
    // But because app.js has defer, it executes after parsing, so these fallbacks would be replaced.
    // However, to prevent errors on click before app.js loads, we provide safe no-op functions.
    if (typeof showHome !== 'function') {
        window.showHome = function() { console.log('Home (fallback)'); };
        window.showTools = function() { console.log('Tools (fallback)'); };
        window.showSaved = function() { console.log('Saved (fallback)'); };
        window.showReferences = function() { console.log('References (fallback)'); };
        window.toggleDarkMode = function() { console.log('Theme toggle (fallback)'); };
    }
</script>
<!-- The real app.js will override these once loaded (defer) – but if it fails, 
     clicking buttons won't crash the page. -->

</body>
</html>
